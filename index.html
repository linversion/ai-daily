<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 日报归档</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.6; }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  p { color: #666; }
  ul { list-style: none; padding: 0; }
  li { padding: 6px 0; }
  a { color: #0366d6; text-decoration: none; }
  a:hover { text-decoration: underline; }
  hr { margin: 24px 0; border: none; border-top: 1px solid #eee; }
</style>
</head>
<body>
<h1>📡 AI 日报</h1>
<p>每日 AI 资讯精选</p>
<hr>
<ul id="archive">
  <li><em>加载中…</em></li>
</ul>
<script>
fetch('/ai-daily/dates.json')
  .then(r => r.json())
  .then(dates => {
    const ul = document.getElementById('archive');
    ul.innerHTML = dates.sort().reverse().map(d =>
      `<li><a href="/ai-daily/${d}/">${d}</a></li>`
    ).join('');
  });
</script>
</body>
</html>
